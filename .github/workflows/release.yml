name: release

# Binaries for `agent-conform`, so checking whether your service conforms to
# this contract does not begin with installing a Go toolchain and building our
# checker.
#
# That was the state until 2026-08-05: the module has been importable with
# `go get` since v0.2.0, which serves anybody already writing Go, and served
# nobody who just wanted to run the tool once against a payload. A conformance
# checker is exactly the artifact that should be obtainable without adopting
# anything.
#
# The library half needs no release: `go get github.com/TAIPANBOX/agent-stack-go`
# resolves from the tag. This publishes the command only.
#
# MONEY: nothing here is metered. Standard runners are free on a public
# repository and no larger runner is requested.

on:
  push:
    tags: ["v*"]
  # The build job runs on a pull request that changes THIS file, and nothing
  # else does: the release job stays off (see its `if`), so a pull request
  # builds the whole matrix and publishes nothing. Added 2026-09-02 after
  # tokenfuse's v0.4.2 failed on both Linux runners the first time its own
  # tag-only release.yml ever reached its musl leg: a workflow gated on
  # `push: tags: v*` and nothing else is tested by exactly one event in its
  # whole life, and that event is the one where a mistake is public.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: build matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches `toolchain` in go.mod. These two disagreeing is not a
          # cosmetic problem: setup-go v6 pins GOTOOLCHAIN=local, so a mismatch
          # stops being a silent extra download and becomes a hard failure.
          go-version: "1.27.0"
          cache: true

      # The three flags below are what make a published binary rebuildable by
      # somebody who does not trust us: CGO off so the output does not depend on
      # a host toolchain, -trimpath so the build directory is not embedded, and
      # -s -w so no build id or symbol table smuggles a path back in. They are
      # the same three `scripts/reproducible-build.sh` checks on every push, and
      # the two must stay identical: losing one here breaks verification in
      # SILENCE, since the build still succeeds and only the person trying to
      # verify us ever finds out.
      - name: build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
            # The asset NAME carries no version, deliberately, and putting one back
            # breaks something outside this repository. it-rat.com links straight to
            # https://github.com/TAIPANBOX/agent-stack-go/releases/latest/download/<this name>,
            # which resolves only while the name is stable. A version here turns
            # every download link on that site into a 404 at the next tag, silently,
            # and the person who finds out is somebody trying to install this.
            #
            # The version is not lost. It is stamped INTO the binary by
            # -X main.version below, which is where `agent-conform version` reads it from
            # and the harder of the two places to fake: a filename can be renamed by
            # anyone between us and the reader.
            out="agent-conform_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}/agent-conform${ext}" ./cmd/agent-conform
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -qr "${out}.zip" "${out}")
            else
              tar -C dist -czf "dist/${out}.tar.gz" "${out}"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: create release
    needs: build
    # Never on a pull request: this job publishes a GitHub release, and the
    # build job above has already proven the matrix on this event. Guarding it
    # off is what stops the pull_request trigger above from shipping a release
    # from a fork's pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # What a stranger verifies, and how (README, "Verify a download"):
      #
      #   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
      #     --certificate-identity https://github.com/TAIPANBOX/agent-stack-go/.github/workflows/release.yml@refs/tags/<tag> \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      #   sha256sum -c SHA256SUMS
      #   gh attestation verify <asset> -R TAIPANBOX/agent-stack-go
      #
      # Keyless: the certificate names this workflow at this tag, so there is no
      # signing key to leak and nothing to rotate. The SBOMs describe the
      # dependency graph this build was made from; the provenance bundle is also
      # attached as an asset so a release page carries it beside the checksums.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: sign the checksums, keyless
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: SBOM of this build, SPDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of this build, CycloneDX
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false
      - name: provenance attestation for every asset
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle as a release asset too
        run: cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag --title "agent-stack-go ${GITHUB_REF_NAME}" --generate-notes

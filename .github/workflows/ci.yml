name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: library packages stay dependency-clean
        run: ./scripts/deps-layering.sh

      # agent-conform decides whether somebody else's payload conforms. A
      # verdict is worth what its checker is worth, so the checker has to be
      # rebuildable by the person receiving the verdict. CGO_ENABLED=0,
      # -trimpath and -s -w hold that, here and in release.yml, and losing one
      # breaks it in silence.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

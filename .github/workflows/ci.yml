name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      - name: library packages stay dependency-clean
        run: ./scripts/deps-layering.sh

      # Every scenario in features/ names a test that exists, and every
      # scenario names one at all. A scenario bound to nothing describes what
      # somebody wanted; a binding pointing at a renamed test reads as held.
      - name: every scenario is bound to a test
        run: ./scripts/features-are-bound.sh

      # A number in a README is a claim with no owner: it is right the day it
      # is written and the suite grows in a commit that never opens the file.
      # On 2026-08-05 four of seven such figures on it-rat.com were found
      # stale against these repositories. This is the same check at the source.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh

      # agent-conform decides whether somebody else's payload conforms. A
      # verdict is worth what its checker is worth, so the checker has to be
      # rebuildable by the person receiving the verdict. CGO_ENABLED=0,
      # -trimpath and -s -w hold that, here and in release.yml, and losing one
      # breaks it in silence.
      - name: a release can be rebuilt byte for byte
        run: ./scripts/reproducible-build.sh

  # The schemas under cmd/agent-conform/schemas/ and in the packages' testdata
  # are copies of files TAIPANBOX/agent-passport owns, vendored so the tool is
  # one static binary and the tests run offline. A copy with nothing comparing
  # it drifts: on 2026-08-05 the vendored Passport schema turned out to be
  # missing SPEC 4.4 and 4.5 entirely, so agent-conform read a filesystem entry
  # with a mode the spec does not have and printed OK.
  #
  # This needs a LAYOUT, not just a checkout. The sibling is checked out BESIDE
  # this repo, exactly as it sits on a developer's machine, and the script's
  # `cd .. && pwd` finds it. Both repos are public, so a standard runner costs
  # nothing.
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: agent-stack-go
      - uses: actions/checkout@v7
        with:
          repository: TAIPANBOX/agent-passport
          path: agent-passport
      - name: the vendored schemas match the repo that owns them
        working-directory: agent-stack-go
        run: ./scripts/schemas-in-sync.sh

      # The teeth harness runs HERE rather than in `build`, and the reason is
      # the layout above. It exercises all four gates, one of which is
      # schemas-in-sync, and that one needs the sibling beside it. In `build`
      # there is no sibling, so that case would fail for the wrong reason: not
      # "the gate stopped catching drift" but "this job cannot host it".
      #
      # It needs Go for readme-numbers (`go test -list`), and it mutates
      # tracked files and restores them, so it runs last in this job.
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent-stack-go/go.mod
          cache-dependency-path: agent-stack-go/go.sum
      - name: the gates above can still fail
        working-directory: agent-stack-go
        run: ./scripts/gates-have-teeth.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
